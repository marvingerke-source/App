<title>Unsere Keto-Küche</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: eine schmale App-Spalte (max. 640px), Kopfzeile oben, Tab-Leiste unten fixiert.
   Farben: Wald-Grün als Akzent, Butter-Gelb für Fett, Rot nur für Warnungen. */
:root {
  --bg: #f3f6f3;
  --surface: #ffffff;
  --surface-2: #e8eee9;
  --ink: #18211c;
  --ink-2: #57655d;
  --line: #d6dfd8;
  --accent: #24684a;
  --accent-ink: #ffffff;
  --accent-soft: #dcece3;
  --butter: #c9930f;
  --butter-soft: #f7ecc8;
  --ok: #24804f;
  --warn: #b7791f;
  --bad: #c0392b;
  --bad-soft: #f8e1de;
  --font-display: "Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 14px;
  --tabbar: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1512; --surface: #18201b; --surface-2: #212b25; --ink: #e6eee8; --ink-2: #9aaba1;
    --line: #2c3831; --accent: #6cc196; --accent-ink: #0c1a12; --accent-soft: #1d3428;
    --butter: #e7b93c; --butter-soft: #3a3018; --ok: #6cc196; --warn: #e3a948; --bad: #ef7b6c; --bad-soft: #3b201c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1512; --surface: #18201b; --surface-2: #212b25; --ink: #e6eee8; --ink-2: #9aaba1;
  --line: #2c3831; --accent: #6cc196; --accent-ink: #0c1a12; --accent-soft: #1d3428;
  --butter: #e7b93c; --butter-soft: #3a3018; --ok: #6cc196; --warn: #e3a948; --bad: #ef7b6c; --bad-soft: #3b201c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
header.top .wrap { display: flex; align-items: center; gap: 10px; padding-block: 12px; }
.brand { font-family: var(--font-display); font-weight: 800; font-size: 1.2rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.01em; flex: 1; min-width: 0; }
.brand small { display: block; font-family: var(--font-body); font-weight: 500; font-size: .78rem; color: var(--ink-2); letter-spacing: 0; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: .75rem; font-weight: 600; padding: 4px 10px; border-radius: 99px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-2); }
.pill.live .dot { background: var(--ok); }
.iconbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; width: 38px; height: 38px; display: grid; place-items: center; cursor: pointer; }
.iconbtn svg { width: 20px; height: 20px; }

main { padding-block: 16px calc(var(--tabbar) + env(safe-area-inset-bottom, 0px) + 24px); display: grid; gap: 16px; }
h2 { font-family: var(--font-display); font-weight: 800; font-size: 1.35rem; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
h3 { font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; margin: 0; }
.muted { color: var(--ink-2); }
.small { font-size: .82rem; }
.num { font-variant-numeric: tabular-nums; }
.eyebrow { font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; min-width: 0; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row > .grow { flex: 1 1 140px; min-width: 0; }
.stack { display: grid; gap: 8px; }
.between { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }

input[type=text], input[type=number], input[type=date], input[type=datetime-local], select, textarea {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; min-height: 42px; width: 100%; min-width: 0;
}
textarea { min-height: 90px; resize: vertical; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
label.f { display: grid; gap: 4px; font-size: .8rem; font-weight: 600; color: var(--ink-2); min-width: 0; }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 14px; min-height: 42px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); }
.btn.sm { min-height: 32px; padding: 4px 10px; font-size: .85rem; border-radius: 8px; }
.btn:disabled { opacity: .5; cursor: default; }

.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 5px 11px; font-size: .84rem; font-weight: 500; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

.tag { font-size: .7rem; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.tag.keto { background: var(--accent-soft); color: var(--accent); }
.tag.karnivor { background: var(--bad-soft); color: var(--bad); }
.tag.omad { background: var(--butter-soft); color: var(--butter); }
.tag.warn { background: var(--bad-soft); color: var(--bad); }
.tag.soon { background: var(--butter-soft); color: var(--butter); }

/* Liste */
.group h4 { margin: 4px 0 2px; font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.item { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); min-width: 0; }
.item:first-of-type { border-top: 0; }
.item .name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.item .name small { display: block; color: var(--ink-2); font-size: .76rem; }
.item.done .name > span { text-decoration: line-through; color: var(--ink-2); }
.check { appearance: none; width: 24px; height: 24px; border: 2px solid var(--line); border-radius: 7px; flex: none; cursor: pointer; display: grid; place-items: center; background: var(--surface); }
.check:checked { background: var(--accent); border-color: var(--accent); }
.check:checked::after { content: ""; width: 6px; height: 11px; border: solid var(--accent-ink); border-width: 0 2.5px 2.5px 0; transform: rotate(45deg) translate(-1px, -1px); }
.x { border: 0; background: transparent; color: var(--ink-2); cursor: pointer; width: 32px; height: 32px; border-radius: 8px; font-size: 1.1rem; flex: none; }
.x:hover { background: var(--surface-2); }
.qty { font-variant-numeric: tabular-nums; color: var(--ink-2); font-size: .88rem; white-space: nowrap; }

/* Plan */
.day { display: grid; gap: 8px; }
.day.today { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.meal { display: flex; align-items: center; gap: 8px; padding: 6px 8px; background: var(--surface-2); border-radius: 9px; min-width: 0; }
.meal .name { flex: 1; min-width: 0; overflow-wrap: anywhere; font-weight: 500; }
.macros { display: flex; gap: 10px; flex-wrap: wrap; font-size: .78rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.macros b { color: var(--ink); font-weight: 700; }
.carb-ok { color: var(--ok) !important; } .carb-mid { color: var(--warn) !important; } .carb-bad { color: var(--bad) !important; }

/* Rezepte */
details.recipe summary { list-style: none; cursor: pointer; display: grid; gap: 6px; }
details.recipe summary::-webkit-details-marker { display: none; }
details.recipe[open] summary { padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.ing { margin: 0; padding-left: 18px; display: grid; gap: 2px; }
.ing li { overflow-wrap: anywhere; }

/* Fasten */
.fast-time { font-family: var(--font-display); font-weight: 800; font-size: 2.4rem; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.bar { height: 10px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .4s; }
.bar.butter > i { background: var(--butter); }
.bar.over > i { background: var(--bad); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
table.t { width: 100%; border-collapse: collapse; font-size: .86rem; font-variant-numeric: tabular-nums; }
table.t th, table.t td { text-align: left; padding: 6px 4px; border-top: 1px solid var(--line); }
table.t th { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); border-top: 0; }
table.t td.r, table.t th.r { text-align: right; }

/* Budget */
.big { font-family: var(--font-display); font-weight: 800; font-size: 1.9rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stats > div { display: grid; gap: 2px; min-width: 0; }
@media (max-width: 420px) { .stats { grid-template-columns: 1fr 1fr; } .big { font-size: 1.5rem; } }

.empty { text-align: center; padding: 22px 10px; color: var(--ink-2); display: grid; gap: 6px; }
.empty strong { color: var(--ink); }
.note { background: var(--butter-soft); border-radius: 10px; padding: 10px 12px; font-size: .86rem; }
.note.info { background: var(--accent-soft); }

nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
nav.tabs .in { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(6, 1fr); height: var(--tabbar); }
nav.tabs button { border: 0; background: transparent; display: grid; place-items: center; align-content: center; gap: 3px; font-size: .68rem; font-weight: 600; color: var(--ink-2); cursor: pointer; padding: 0; min-width: 0; position: relative; }
nav.tabs button svg { width: 22px; height: 22px; }
nav.tabs button[aria-current="page"] { color: var(--accent); }
nav.tabs .badge { position: absolute; top: 6px; left: calc(50% + 6px); background: var(--accent); color: var(--accent-ink); font-size: .62rem; border-radius: 99px; padding: 0 5px; min-width: 16px; line-height: 16px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabbar) + env(safe-area-inset-bottom, 0px) + 14px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: .88rem; font-weight: 600; z-index: 20; max-width: calc(100% - 32px); }
.sheet { border: 2px solid var(--accent); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

  <div class="wrap">

<script>
"use strict";
/* ============================================================
   Unsere Keto-Küche – gemeinsame Einkaufs- und Ernährungsplanung
   Speicher: claude.ai-Datenbank (live geteilt) oder localStorage.
   ============================================================ */

// ---------- Hilfsfunktionen ----------
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else if (k === "html") el.innerHTML = v; // nur für eigene, statische SVGs
    else if (k === "value") el.value = v;
    else if (k === "checked") el.checked = !!v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, "0");
const dkey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const mondayOf = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); const wd = (x.getDay() + 6) % 7; return addDays(x, -wd); };
const isoWeek = d => { const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day); const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1)); return Math.ceil(((t - y0) / 864e5 + 1) / 7); };
const WD = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];
const WDL = ["Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"];
const fmtD = d => `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.`;
const euro = n => (Number(n) || 0).toLocaleString("de-DE", { style: "currency", currency: "EUR" });
const numDE = n => (Math.round(n * 100) / 100).toLocaleString("de-DE");
const toNum = s => { const n = parseFloat(String(s).replace(",", ".")); return isNaN(n) ? null : n; };
const lsGet = (k, fb) => { try { const v = localStorage.getItem(k); return v == null ? fb : JSON.parse(v); } catch { return fb; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const norm = s => String(s || "").trim().toLowerCase();

let toastTimer;
function toast(msg) {
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const t = h("div", { class: "toast", role: "status" }, msg);
  document.body.append(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), 3200);
}

// ---------- Fachdaten ----------
const CATS = ["Fleisch", "Fisch", "Eier & Milch", "Gemüse", "Obst (low carb)", "Fette & Öle", "Vorrat & Gewürze", "Getränke", "Drogerie & Haushalt", "Sonstiges"];
const CAT_WORDS = [
  ["Fisch", "lachs thunfisch makrele hering forelle garnele shrimp sardine kabeljau fisch dorsch seelachs"],
  ["Fleisch", "hack rind steak ribeye entrecote rumpsteak hähnchen huhn pute schwein speck bacon bauch wurst salami schinken leber lamm kotelett filet gulasch braten mett chorizo herz knochen markknochen talg"],
  ["Eier & Milch", "ei eier butter sahne käse cheddar gouda feta parmesan mozzarella mascarpone quark joghurt schmand frischkäse ghee milch skyr camembert brie"],
  ["Fette & Öle", "öl olivenöl kokosöl schmalz mct mayonnaise mayo"],
  ["Gemüse", "brokkoli blumenkohl zucchini spinat salat gurke paprika pilze champignon kohl rosenkohl spargel avocado bohnen zwiebel knoblauch tomate rucola sellerie aubergine lauch kräuter petersilie"],
  ["Obst (low carb)", "beere himbeer heidelbeer erdbeer brombeer zitrone limette"],
  ["Getränke", "wasser kaffee tee mineral sprudel"],
  ["Drogerie & Haushalt", "magnesium kalium tabletten zahnpasta spülmittel küchenrolle müllbeutel"],
  ["Vorrat & Gewürze", "salz pfeffer brühe gewürz paprikapulver curry senf essig nüsse mandel walnuss macadamia leinsamen chia kokos erythrit xylit passiert tomatenmark"],
];
function guessCat(name) {
  const n = norm(name);
  for (const [cat, words] of CAT_WORDS) if (words.split(" ").some(w => n.includes(w))) return cat;
  return "Sonstiges";
}
const CARB_WORDS = ["brot", "brötchen", "toast", "nudel", "pasta", "spaghetti", "reis", "kartoffel", "pommes", "zucker", "mehl", "banane", "apfel", "traube", "saft", "müsli", "cornflakes", "haferflocken", "honig", "bier", "cola", "limo", "chips", "pizza", "linsen", "kichererbse", "mais", "couscous", "bulgur", "gnocchi", "marmelade", "schokolade", "keks", "kuchen"];
const carbWarn = name => { const n = norm(name); return CARB_WORDS.some(w => n.includes(w)) && !/zuckerfrei|ohne zucker|low ?carb|keto/.test(n); };

const QUICK = [
  ["Eier", 10, "Stk"], ["Butter", 250, "g"], ["Rinderhack", 500, "g"], ["Bacon", 200, "g"], ["Sahne", 200, "ml"],
  ["Gouda", 200, "g"], ["Avocado", 2, "Stk"], ["Lachsfilet", 400, "g"], ["Hähnchenschenkel", 1, "kg"],
  ["Brokkoli", 500, "g"], ["Meersalz", 1, "Pck"], ["Knochenbrühe", 1, "l"], ["Mineralwasser", 6, "l"], ["Magnesium", 1, "Pck"],
];

// Rezepte jeweils für 2 Portionen; Makros pro Portion (Richtwerte).
const BUILTIN = [
  { id: "b-ruehrei", name: "Rührei mit Speck", tags: ["keto", "karnivor"], m: [640, 35, 54, 2], min: 10,
    ing: [[6, "Stk", "Eier"], [150, "g", "Bacon"], [20, "g", "Butter"]],
    steps: "Speck knusprig braten. Eier mit Salz verquirlen, in Butter bei mittlerer Hitze cremig stocken lassen." },
  { id: "b-ribeye", name: "Ribeye mit Kräuterbutter und Brokkoli", tags: ["keto", "omad"], m: [900, 62, 68, 5], min: 25,
    ing: [[600, "g", "Ribeye-Steak"], [40, "g", "Butter"], [400, "g", "Brokkoli"], [2, "Zehe", "Knoblauch"]],
    steps: "Steaks 30 min vorher aus dem Kühlschrank. Scharf anbraten, mit Butter und Knoblauch arrosieren, ruhen lassen. Brokkoli dämpfen, mit Butter schwenken." },
  { id: "b-hackpfanne", name: "Hackfleischpfanne mit Zucchini und Feta", tags: ["keto"], m: [720, 50, 55, 6], min: 20,
    ing: [[500, "g", "Rinderhack"], [400, "g", "Zucchini"], [200, "g", "Feta"], [2, "EL", "Olivenöl"]],
    steps: "Hack krümelig braten, Zucchiniwürfel dazu, würzen. Feta darüberbröseln und kurz schmelzen lassen." },
  { id: "b-lachs", name: "Lachs auf Rahmspinat", tags: ["keto"], m: [720, 45, 56, 5], min: 20,
    ing: [[400, "g", "Lachsfilet"], [450, "g", "Blattspinat"], [200, "ml", "Sahne"], [2, "Zehe", "Knoblauch"]],
    steps: "Lachs auf der Hautseite braten. Spinat mit Knoblauch zusammenfallen lassen, Sahne einkochen, salzen, Muskat." },
  { id: "b-burger", name: "Burger-Patties ohne Bun", tags: ["keto", "karnivor"], m: [850, 60, 66, 1], min: 15,
    ing: [[600, "g", "Rinderhack"], [100, "g", "Cheddar"], [2, "Stk", "Eier"]],
    steps: "Hack salzen, 4 Patties formen, scharf braten. Cheddar auflegen, mit Spiegelei servieren." },
  { id: "b-haehnchen", name: "Ofen-Hähnchenschenkel mit Blumenkohlpüree", tags: ["keto"], m: [950, 60, 72, 9], min: 50,
    ing: [[1, "kg", "Hähnchenschenkel"], [800, "g", "Blumenkohl"], [40, "g", "Butter"], [100, "ml", "Sahne"]],

const Store = {
  db: null, live: false, listeners: {},
  async init() {
    try {
      if (window.claude && typeof window.claude.use === "function") {
        const db = await window.claude.use("db");
        if (db) { this.db = db; this.live = true; }
      }
    } catch (e) { /* lokal weiter */ }
  },
  watch(col, cb) {
    if (this.db) {
      return this.db.collection(col).onSnapshot(
        snap => cb(snap.docs.map(d => ({ id: d.id, ...(d.data() || {}) }))),
        err => { setSync("error", err && err.message); }
      );
    }
    (this.listeners[col] ||= []).push(cb);
    cb(this._local(col));
    return () => {};
  },
  _local(col) { const m = lsGet("kk_" + col, {}); return Object.entries(m).map(([id, v]) => ({ id, ...v })); },
  _emit(col) { (this.listeners[col] || []).forEach(cb => cb(this._local(col))); },
  async set(col, id, data) {
    if (this.db) return this.db.collection(col).doc(id).set(data).catch(failWrite);
    const m = lsGet("kk_" + col, {}); m[id] = data; lsSet("kk_" + col, m); this._emit(col);
  },
  async update(col, id, data) {
    if (this.db) return this.db.collection(col).doc(id).update(data).catch(failWrite);
    const m = lsGet("kk_" + col, {}); m[id] = { ...(m[id] || {}), ...data }; lsSet("kk_" + col, m); this._emit(col);
  },
  async del(col, id) {
    if (this.db) return this.db.collection(col).doc(id).delete().catch(failWrite);
    const m = lsGet("kk_" + col, {}); delete m[id]; lsSet("kk_" + col, m); this._emit(col);
  },
};
function failWrite(e) {
  const code = e && e.code;
  toast(code === "not_granted" ? "Keine Schreibrechte. Bitte mit Bearbeiten-Recht teilen lassen." : "Speichern fehlgeschlagen. Bitte erneut versuchen.");

function parseQty(text) {
  const m = String(text || "").trim().match(/^([\d.,]+)\s*([a-zA-ZäöüÄÖÜ]+)?$/);
  if (!m) return { q: null, u: "", raw: String(text || "").trim() };
  return { q: toNum(m[1]), u: m[2] || "", raw: "" };
}
function normUnit(q, u) {
  if (u === "kg") return [q * 1000, "g"];
  if (u === "l") return [q * 1000, "ml"];
  return [q, u];
}
function showQty(q, u) {
  if (q == null) return "";
  if (u === "g" && q >= 1000) return numDE(q / 1000) + " kg";
  if (u === "ml" && q >= 1000) return numDE(q / 1000) + " l";
  return numDE(q) + (u ? " " + u : "");
}
async function addItem(name, q, u, src, note) {
  name = String(name || "").trim();
  if (!name) return;
  let nq = q, nu = u || "";
  if (q != null) [nq, nu] = normUnit(q, nu);
  const ex = S.items.find(i => !i.done && norm(i.name) === norm(name) && (i.u || "") === nu && (i.q != null) === (nq != null));
  if (ex && nq != null) return Store.update("items", ex.id, { q: (ex.q || 0) + nq });
  if (ex && nq == null) return;
  return Store.set("items", uid(), { name, q: nq, u: nu, note: note || "", cat: guessCat(name), done: false, by: me(), src: src || "", t: Date.now() });
}

function dayMacros(meals) {
  return meals.reduce((a, m) => { const r = recipeById(m.rid); if (r && r.m) r.m.forEach((v, i) => a[i] += Number(v) || 0); return a; }, [0, 0, 0, 0]);
}
function carbClass(c, limit) { return c <= limit ? "carb-ok" : c <= limit * 1.5 ? "carb-mid" : "carb-bad"; }
function recipeSelect(onPick, label) {
  const s = settings();
  const rs = allRecipes();
  const pref = s.phase === "carniomad" ? "karnivor" : (s.phase === "omad" ? "omad" : null);
  const sorted = pref ? [...rs.filter(r => (r.tags || []).includes(pref)), ...rs.filter(r => !(r.tags || []).includes(pref))] : rs;
  return h("select", { "aria-label": label || "Gericht wählen", onchange: e => { if (e.target.value) { onPick(e.target.value); e.target.value = ""; } } },
    h("option", { value: "" }, "+ Gericht hinzufügen …"),
    sorted.map(r => h("option", { value: r.id }, r.name + ((r.tags || []).length ? "  (" + r.tags.join(", ") + ")" : ""))));
}
function addToPlan(dateKey, rid) {
  const doc = S.plan.find(p => p.id === dateKey);
  const meals = [...((doc && doc.meals) || []), { rid, k: uid() }];
  return Store.set("plan", dateKey, { meals });
}
views.plan = {
  mount(root) {

  },
  update() {
    const s = settings(); const ph = PHASES[s.phase] || PHASES.keto;
    const end = addDays(weekStart, 6);
    this.head.replaceChildren(
      h("div", null, h("h2", null, `KW ${isoWeek(weekStart)}`), h("div", { class: "muted small num" }, `${fmtD(weekStart)} – ${fmtD(end)}${end.getFullYear()}`)),
      h("div", { class: "row" },
        h("button", { class: "btn sm", "aria-label": "Vorige Woche", onclick: () => { weekStart = addDays(weekStart, -7); this.update(); } }, "‹"),
        h("button", { class: "btn sm", onclick: () => { weekStart = mondayOf(new Date()); this.update(); } }, "Heute"),
        h("button", { class: "btn sm", "aria-label": "Nächste Woche", onclick: () => { weekStart = addDays(weekStart, 7); this.update(); } }, "›"))
    );
    const keys = [...Array(7)].map((_, i) => dkey(addDays(weekStart, i)));
    const planned = keys.reduce((n, k) => n + (((S.plan.find(p => p.id === k) || {}).meals) || []).length, 0);
    this.actions.replaceChildren(
      h("div", { class: "between" }, h("div", null, h("strong", null, ph.label), h("div", { class: "muted small" }, `Ziel: ${ph.meals} pro Tag · max. ${s.carbLimit} g Netto-Carbs`)),
        h("button", { class: "btn primary", disabled: planned ? null : true, onclick: () => this.toList(keys) }, "Zutaten auf die Liste")),
      h("div", { class: "muted small" }, planned ? `${planned} Gerichte geplant. Rezepte sind für 2 Portionen, Vorrat wird abgezogen.` : "Noch nichts geplant. Wähl pro Tag ein Gericht aus.")
    );
    const today = dkey(new Date());
    this.days.replaceChildren(...keys.map(k => {
      const d = parseKey(k);
      const meals = ((S.plan.find(p => p.id === k) || {}).meals) || [];
      const [kcal, p, f, c] = dayMacros(meals);
      const tooMany = (s.phase === "omad" || s.phase === "carniomad") && meals.length > 1;
      return h("div", { class: "card day" + (k === today ? " today" : "") },
        h("div", { class: "between" }, h("h3", null, `${WDL[d.getDay()]}, ${fmtD(d)}`),
          meals.length ? h("div", { class: "macros", title: "pro Person" }, h("span", null, h("b", null, Math.round(kcal)), " kcal"), h("span", null, "P ", h("b", null, Math.round(p))), h("span", null, "F ", h("b", null, Math.round(f))),
            h("span", null, "KH ", h("b", { class: carbClass(c, s.carbLimit) }, Math.round(c), " g"))) : null),
        meals.map((m, idx) => { const r = recipeById(m.rid); return h("div", { class: "meal" },
          h("span", { class: "name" }, r ? r.name : "Gelöschtes Rezept"),
          h("button", { class: "x", "aria-label": "Gericht entfernen", onclick: () => Store.set("plan", k, { meals: meals.filter((_, j) => j !== idx) }) }, "×")); }),
        tooMany ? h("div", { class: "note small" }, "OMAD-Phase: mehr als eine Mahlzeit geplant. In der Übergangszeit okay.") : null,
        recipeSelect(rid => addToPlan(k, rid), `Gericht für ${WDL[d.getDay()]}`)
      );
    }));
  },
  async toList(keys) {
    const need = {};
    for (const k of keys) for (const m of (((S.plan.find(p => p.id === k) || {}).meals) || [])) {
      const r = recipeById(m.rid); if (!r) continue;
      for (const [q, u, n] of r.ing) { const [nq, nu] = normUnit(Number(q), u); const key = norm(n) + "|" + nu; (need[key] ||= { n, u: nu, q: 0 }).q += nq; }
    }
    let added = 0, covered = 0;
    for (const x of Object.values(need)) {
      let q = x.q;
      for (const p of S.pantry.filter(p => norm(p.name) === norm(x.n) || norm(p.name).includes(norm(x.n)))) {
        const [pq, pu] = normUnit(Number(p.q) || 0, p.u || "");
        if (pu === x.u) q -= pq;
      }
      if (q <= 0) { covered++; continue; }
      await addItem(x.n, Math.ceil(q * 10) / 10, x.u, "plan"); added++;
    }
    toast(`${added} Positionen ergänzt` + (covered ? `, ${covered} aus dem Vorrat gedeckt` : ""));
  },
};

  if (!days.has(dkey(d))) d = addDays(d, -1);
  while (days.has(dkey(d))) { n++; d = addDays(d, -1); }
  return n;
}

  tab = "settings"; renderTabs();
  const main = document.getElementById("main"); main.replaceChildren(); current = views.settings; current.mount(main); window.scrollTo(0, 0);
});

// ---------- Sync-Anzeige ----------
function setSync(state, msg) {
  const pill = document.getElementById("syncPill"), txt = document.getElementById("syncText");
  pill.classList.toggle("live", state === "live");
  txt.textContent = state === "live" ? "Live geteilt" : state === "local" ? "Nur dieses Gerät" : state === "error" ? "Sync-Fehler" : "Verbinde …";
  if (msg) pill.title = msg;
}

// ---------- Start ----------
async function start() {
  renderTabs();
  go(TABS.some(t => t[0] === tab) ? tab : "liste");
  await Store.init();
  setSync(Store.live ? "live" : "local");
  for (const col of COLS) {
    Store.watch(col, docs => { S[col] = docs; S.loaded.add(col); refresh(); });
  }
  setTimeout(() => { if (!S.loaded.has("items")) { S.loaded.add("items"); setSync("error", "Daten kamen nicht an"); refresh(); } }, 10000);
  setInterval(() => { const a = document.activeElement; if (tab === "fasten" && !(a && a.tagName === "INPUT")) views.fasten.update(); }, 30000);
}
start();
</script>
