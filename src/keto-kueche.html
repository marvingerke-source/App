let toastTimer;
function toast(msg, actionLabel, action) {
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const t = h("div", { class: "toast", role: "status" }, h("span", null, msg),
    actionLabel ? h("button", { onclick: () => { action(); t.remove(); } }, actionLabel) : null);
  document.body.append(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), actionLabel ? 5000 : 2800);
}

}

let weekStart = mondayOf(new Date());
views.woche = {
  mode: lsGet("kk_wmode", "plan"), day: dkey(new Date()), filter: "alle", q: "",
  mount(root) {
    const seg = h("div", { class: "seg", style: "margin:4px 0 4px" }, [["plan", "Plan"], ["rezepte", "Rezepte"]].map(([k, l]) =>
      h("button", { type: "button", "aria-pressed": this.mode === k ? "true" : "false", onclick: () => { this.mode = k; lsSet("kk_wmode", k); go("woche"); } }, l)));

    if (this.mode === "rezepte") this.mountRecipes();
  },
  update() { if (this.mode === "plan") this.renderPlan(); else this.renderRecipes(); },

  // ---- Plan ----
  renderPlan() {
    const s = settings(); const today = dkey(new Date());
    const keys = [...Array(7)].map((_, i) => dkey(addDays(weekStart, i)));
    if (!keys.includes(this.day)) this.day = keys.includes(today) ? today : keys[0];
    const strip7 = h("div", { class: "card", style: "padding:10px 8px 8px;margin-top:12px" },
      h("div", { class: "weekhead", style: "padding:0 6px" }, h("strong", null, `KW ${isoWeek(weekStart)} · ${MON[weekStart.getMonth()]}`),
        h("div", { class: "navs" },
          h("button", { type: "button", "aria-label": "Vorige Woche", onclick: () => { weekStart = addDays(weekStart, -7); this.day = dkey(weekStart); this.update(); } }, "‹"),
          h("button", { type: "button", onclick: () => { weekStart = mondayOf(new Date()); this.day = today; this.update(); } }, "Heute"),
          h("button", { type: "button", "aria-label": "Nächste Woche", onclick: () => { weekStart = addDays(weekStart, 7); this.day = dkey(weekStart); this.update(); } }, "›"))),
      h("div", { class: "week" }, keys.map(k => { const d = parseKey(k); const n = planOf(k).length;
        return h("button", { type: "button", class: k === today ? "today" : "", "aria-pressed": k === this.day ? "true" : "false", "aria-label": fmtLong(d) + (n ? `, ${n} Gerichte` : ""), onclick: () => { this.day = k; this.update(); } },
          h("span", { class: "wd" }, WD[d.getDay()]), h("span", { class: "dn" }, d.getDate()), h("span", { class: "dots" }, [...Array(Math.min(n, 3))].map(() => h("i"))));
      })));
    const meals = planOf(this.day); const d = parseKey(this.day);
    const tot = meals.reduce((a, m) => { const r = recipeById(m.rid); if (r && r.m) r.m.forEach((v, i) => a[i] += Number(v) || 0); return a; }, [0, 0, 0, 0]);
    const dayHead = meals.length ? h("div", { class: "card today-row", style: "margin-top:12px" },
      ring(tot[3] / (s.carbLimit || 20), 64, 8, carbColor(tot[3], s.carbLimit), h("b", { style: "font-size:15px" }, Math.round(tot[3]))),
      h("div", { class: "txt" }, h("strong", null, `${Math.round(tot[3])} von ${s.carbLimit} g Netto-KH`), h("span", { class: "cell-sub" }, `${Math.round(tot[0])} kcal · ${Math.round(tot[1])} g Protein · ${Math.round(tot[2])} g Fett pro Person`))) : null;
    const mealRows = meals.map((m, idx) => { const r = recipeById(m.rid);
      const c = r && recipeCost(r);
      return swipeable(row({ title: r ? r.name : "Gelöschtes Rezept", sub: r ? `${r.m[0]} kcal · ${r.m[3]} g KH${c && c.ok ? ` · ≈ ${euro(c.perPortion)}` : ""}` : null, onclick: r ? () => recipeSheet(r) : null }),
        () => { const rest = meals.filter((_, j) => j !== idx); Store.set("plan", this.day, { meals: rest }); toast("Gericht entfernt", "Rückgängig", () => Store.set("plan", this.day, { meals })); });
    });
    const omadHint = isOmad() && meals.length > 1 ? h("div", { class: "sec-f" }, "OMAD-Phase: Mehr als eine Mahlzeit geplant. In der Übergangszeit ist das in Ordnung.") : null;
    const planned = keys.reduce((n, k) => n + planOf(k).length, 0);
    const weekCost = keys.reduce((sum, k) => sum + planOf(k).reduce((a, m) => { const r = recipeById(m.rid); const c = r && recipeCost(r); return a + (c && c.ok ? c.perPortion * 2 : 0); }, 0), 0);
    const queue = S.queue.slice().sort((a, b) => a.t - b.t).map(q => ({ q, r: recipeById(q.rid) })).filter(x => x.r);
    fill(this.body, strip7, dayHead,
      h("section", { class: "sec" }, h("div", { class: "sec-h" }, fmtLong(d)),
        h("div", { class: "group" }, mealRows, h("button", { class: "cell link", type: "button", onclick: () => pickerSheet(this.day) }, h("span", { html: ICON.plus, style: "display:flex;width:18px" }), "Gericht hinzufügen")), omadHint),
      sec("Diese Woche", [
        row({ title: "Woche automatisch füllen", sub: "Nur freie Tage ab heute, passend zur Phase", onclick: () => this.autoFill(keys) }),
        row({ title: "Zutaten auf die Einkaufsliste", sub: planned ? `${planned} Gerichte${weekCost ? ` · ca. ${euro(weekCost)} für euch beide` : ""} · Vorrat wird abgezogen` : "Noch nichts geplant", onclick: planned ? () => this.toList(keys) : null }),
      ]),
      sec("Merkliste", queue.length ? queue.map(({ q, r }) => swipeable(row({ title: r.name, sub: `${r.m[0]} kcal · ${r.m[3]} g KH`, onclick: () => recipeSheet(r) }), () => deleteWithUndo("queue", q, r.name)))
        : h("div", { class: "empty", style: "padding:18px" }, "Rezepte, die ihr bald kochen wollt. Im Rezept auf „Merken“ tippen."), { foot: queue.length ? "Beim Einplanen verschwindet ein Rezept von der Merkliste." : null }));
  },
  async autoFill(keys) {
    const s = settings(); const per = isOmad() ? 1 : 2;
    const all = allRecipes().filter(r => r.m && !(r.tags || []).includes("dessert") && (r.min || 0) <= 180 && !isExcluded(r));
    let pool = s.phase === "carniomad" ? all.filter(r => r.tags.includes("karnivor")) : s.phase === "omad" ? all.filter(r => r.tags.includes("omad") || Number(r.m[0]) >= 800) : all.filter(r => (r.tags || []).includes("keto"));
    if (!pool.length) pool = all;
    const pantry = S.pantry.map(p => norm(p.name)), used = new Map(), today = dkey(new Date());
    keys.forEach(k => planOf(k).forEach(m => used.set(m.rid, (used.get(m.rid) || 0) + 1)));
    const queued = new Set(S.queue.map(q => q.rid));
    let filled = 0;
    for (const k of keys) {
      if (k < today || planOf(k).length) continue;
      const meals = []; let carbs = 0;
      for (let i = 0; i < per; i++) {
        const scored = pool.filter(r => !meals.some(m => m.rid === r.id) && carbs + Number(r.m[3]) <= s.carbLimit).map(r => {
          let sc = Math.random() * 2 - (used.get(r.id) || 0) * 4 + (queued.has(r.id) ? 3 : 0);
          sc += r.ing.filter(([, , n]) => pantry.some(p => p.includes(norm(n)) || norm(n).includes(p))).length * 1.5;
          const c = recipeCost(r); if (c.ok) sc -= c.perPortion / 3;
          return [r, sc];
        }).sort((a, b) => b[1] - a[1]);
        if (!scored.length) break;
        const pick = scored[0][0];
        meals.push({ rid: pick.id, k: uid() }); carbs += Number(pick.m[3]); used.set(pick.id, (used.get(pick.id) || 0) + 1);
      }
      if (meals.length) { await Store.set("plan", k, { meals }); filled++; }
    }
    toast(filled ? `${filled} ${filled === 1 ? "Tag" : "Tage"} gefüllt` : "Keine freien Tage mehr in dieser Woche");
  },
  async toList(keys) {
    const need = {};
    for (const k of keys) for (const m of planOf(k)) {
      const r = recipeById(m.rid); if (!r) continue;
      for (const [q, u, n] of r.ing) { const [nq, nu] = normUnit(Number(q), u); const key = norm(n) + "|" + nu; (need[key] ||= { n, u: nu, q: 0 }).q += nq; }
    }
    let added = 0, covered = 0;
    for (const x of Object.values(need)) {
      let q = x.q;
      for (const p of S.pantry.filter(p => norm(p.name) === norm(x.n) || norm(p.name).includes(norm(x.n)))) { const [pq, pu] = normUnit(Number(p.q) || 0, p.u || ""); if (pu === x.u) q -= pq; }
      if (q <= 0) { covered++; continue; }
      await addItem(x.n, Math.ceil(q * 10) / 10, x.u, "plan"); added++;
    }
    toast(`${added} Zutaten auf der Liste` + (covered ? `, ${covered} aus dem Vorrat` : ""));
  },

  // ---- Rezepte ----
  mountRecipes() {
    this.search = h("input", { type: "text", id: "reSearch", placeholder: "Rezept oder Zutat suchen", value: this.q, oninput: e => { this.q = e.target.value; this.renderRecipes(); } });

    this.renderAi();
  },

  let n = 0, d = new Date(); if (!days.has(dkey(d))) d = addDays(d, -1);
  while (days.has(dkey(d))) { n++; d = addDays(d, -1); }

}

// ---------- Sync-Anzeige ----------
function setSync(state, msg) {
  const el = document.getElementById("sync");
  el.className = "sync" + (state === "live" ? " live" : state === "err" ? " err" : "");
  document.getElementById("syncText").textContent = state === "live" ? "Geteilt" : state === "local" ? "Nur dieses Gerät" : state === "err" ? "Sync-Fehler" : "Verbinde …";
  if (msg) el.title = msg;
}

// ---------- Start ----------
async function start() {
  renderTabs(); go(tab);
  await Store.init();
  setSync(Store.live ? "live" : "local");
  for (const col of COLS) Store.watch(col, docs => {
    S[col] = docs; const first = !S.loaded.has(col); S.loaded.add(col); refresh();

  setTimeout(() => { if (!S.loaded.has("items")) { S.loaded.add("items"); setSync("err", "Daten kamen nicht an"); refresh(); } }, 10000);
  setInterval(() => { if (tab === "ich" && !sheetDepth) views.ich.update(); }, 20000);
}
start();
