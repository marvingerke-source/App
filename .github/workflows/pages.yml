name: Deploy Web-Prototyp zu GitHub Pages

on:
  push:
    branches: ["claude/new-session-aatz6y"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: GitHub Pages konfigurieren (und ggf. aktivieren)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Web-Prototyp als Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
